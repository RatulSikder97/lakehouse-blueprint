global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: trino
    metrics_path: /metrics
    # Trino's OpenMetrics endpoint requires an identified user.
    http_headers:
      X-Trino-User:
        values: [prometheus]
    static_configs:
      - targets: ["trino:8080"]

  - job_name: minio-cluster
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: minio-bucket
    metrics_path: /minio/v2/metrics/bucket
    static_configs:
      - targets: ["minio:9000"]

  - job_name: lakekeeper
    metrics_path: /metrics
    static_configs:
      - targets: ["lakekeeper:9000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
