# Iceberg connector backed by the Lakekeeper REST catalog.
# Storage credentials are vended per table by Lakekeeper (STS against MinIO),
# so Trino holds no long-lived S3 keys.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.security=NONE
iceberg.rest-catalog.vended-credentials-enabled=true
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
# Local sandbox only: allow maintenance demos to expire snapshots / orphans immediately.
# Production should keep the 7d defaults.
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
