version: 2

models:
  - name: daily_trip_metrics
    description: One row per pickup date with volume, revenue and tipping behaviour.
    columns:
      - name: pickup_date
        data_tests: [not_null, unique]
      - name: trips
        data_tests: [not_null, non_negative]
      - name: revenue
        data_tests: [not_null, non_negative]

  - name: zone_revenue_monthly
    description: Monthly trips and revenue by pickup zone.
    data_tests:
      - unique_combination:
          arguments:
            columns: [pickup_month, location_id]
    columns:
      - name: location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('taxi_zones')
                field: location_id
      - name: revenue
        data_tests: [non_negative]

  - name: payment_mix_monthly
    description: Share of trips and revenue by payment method per month.
    data_tests:
      - unique_combination:
          arguments:
            columns: [pickup_month, payment_method]
    columns:
      - name: share_of_trips_pct
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 100}
