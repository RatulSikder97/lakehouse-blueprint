version: 2

sources:
  - name: bronze
    description: Raw-but-conformed landing tables written by the Python ingestion job (PyIceberg) and CDC MERGE.
    database: "{{ target.database }}"
    schema: bronze
    meta:
      # dbt-duckdb (CI target) reads a parquet fixture instead of the Iceberg table.
      external_location: "read_parquet('{{ env_var('DBT_CI_DATA_DIR', 'ci_data') }}/{name}.parquet')"
    tables:
      - name: yellow_trips
        description: NYC TLC yellow taxi trips, one row per trip, kept current by CDC MERGE.
        meta:
          dagster:
            asset_key: ["bronze", "yellow_trips"]
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
        columns:
          - name: trip_id
            description: Stable business key (source month + row position, or late-* for CDC inserts).
            data_tests:
              - not_null
              - unique
          - name: source_month
            data_tests:
              - not_null
          - name: _ingested_at
            description: Ingestion time; CDC updates bump it to the change timestamp.
            data_tests:
              - not_null
